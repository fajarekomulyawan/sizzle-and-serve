<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sizzle &amp; Serve — a tiny cooking game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <canvas id="game" width="1280" height="800"></canvas>
  <p class="hint">Click ingredients to build the dish on the plate. Patty, egg and bacon
  cook on the stove first. Click an order ticket to serve it. Keys 1–8 pick ingredients,
  space serves a matching ticket, T trashes the plate, R restarts the day.</p>
</main>
<script src="js/recipes.js"></script>
<script src="js/audio.js"></script>
<script src="js/draw.js"></script>
<script src="js/game.js"></script>
</body>
</html>
